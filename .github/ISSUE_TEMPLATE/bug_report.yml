name: Bug report
description: Report a replay, reduction, installation or export problem.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Small sanitized reproduction
      description: Journey JSON or a public local fixture. Remove private values, URLs and screenshots.
      render: json
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: ReproCut version, Node version, operating system
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Status and evidence
      description: Relevant trial outcomes, failedActionId and error. Is the original journey reproducible outside ReproCut?
